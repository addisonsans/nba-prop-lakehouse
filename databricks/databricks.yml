# Databricks Asset Bundle: the Databricks side of the lakehouse, defined as code.
#   cd databricks && databricks bundle deploy      # create/update the job
#   databricks bundle run bronze_ingest            # run it now
bundle:
  name: nba_lakehouse

workspace:
  profile: nba # ~/.databrickscfg profile (created by `databricks auth login --profile nba`)

resources:
  jobs:
    bronze_ingest:
      name: nba-lakehouse-bronze-silver-gold
      description: Load new landing-volume files into nba.bronze (Auto Loader), then rebuild nba.silver and nba.gold, then score tonight's props and lock new picks.
      # 6:30am ET picks up the 6am box scores; 5:30pm ET picks up the 5pm odds snapshot.
      schedule:
        quartz_cron_expression: "0 30 6,17 * * ?"
        timezone_id: America/New_York
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/gold.py
        - task_key: picks
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ./notebooks/picks.py

    model_backtest:
      name: nba-lakehouse-model-backtest
      description: Walk-forward backtest of the points model against real prop lines (run on demand).
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: backtest
          notebook_task:
            notebook_path: ./notebooks/model_backtest.py

    model_backtest:
      name: nba-points-model-backtest
      description: Walk-forward backtest of the points model against real prop lines (run on demand).
      tasks:
        - task_key: backtest
          notebook_task:
            notebook_path: ./notebooks/model_backtest.py

targets:
  free:
    default: true
